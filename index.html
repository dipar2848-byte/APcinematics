<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AP Cinematic — social media video creator. Cinematic content, Navi Mumbai." />
  <meta name="theme-color" content="#070b1f" />
  <title>AP Cinematic</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Global atmospheric color field (CSS light spills) -->
  <div class="atmos" aria-hidden="true">
    <span class="atmos__blob atmos__blob--cyan"></span>
    <span class="atmos__blob atmos__blob--magenta"></span>
    <span class="atmos__blob atmos__blob--gold"></span>
    <span class="atmos__grain"></span>
  </div>

  <!-- ============================ NAV ============================ -->
  <header class="nav" id="nav">
    <a href="#top" class="nav__brand" data-brand-name></a>
    <nav class="nav__links">
      <a href="#work" class="nav__link">Poster</a>
      <a href="#about" class="nav__link">About</a>
      <a href="#booking" class="nav__cta" data-hero-cta1></a>
    </nav>
  </header>

  <!-- ============================ HERO =========================== -->
  <section class="hero" id="top">
    <div class="hero__inner">
      <p class="hero__brand reveal" data-brand-name></p>
      <h1 class="hero__headline">
        <span class="reveal" data-hero-line1></span>
        <span class="reveal" data-hero-line2></span>
      </h1>
      <p class="hero__supporting reveal" data-hero-supporting></p>
      <div class="hero__actions reveal">
        <a class="btn btn--gold" href="#booking" data-hero-cta1></a>
        <a class="btn btn--ghost" data-hero-cta2 target="_blank" rel="noopener"></a>
      </div>
    </div>

    <a href="#work" class="hero__scroll" aria-label="Scroll down">
      <span data-hero-scrollhint></span>
      <span class="hero__scroll-line"></span>
    </a>
  </section>

  <!-- ========================= POSTER ============================ -->
  <section class="work section" id="work">
    <div class="work__text">
      <p class="work__kicker reveal" data-poster-kicker></p>
      <p class="work__caption reveal" data-poster-caption></p>
    </div>
    <figure class="work__poster reveal" data-parallax-soft>
      <div class="work__frame">
        <img class="work__img" data-poster-img alt="" />
      </div>
    </figure>
  </section>

  <!-- ========================= PROCESS =========================== -->
  <section class="process section" id="process">
    <h2 class="process__heading reveal" data-process-heading></h2>
    <ol class="process__list" data-process-list></ol>
  </section>

  <!-- ======================= WHAT WE SHOOT ======================= -->
  <section class="shoot section" id="shoot">
    <div class="shoot__head">
      <h2 class="shoot__heading reveal" data-shoot-heading></h2>
      <p class="shoot__intro reveal" data-shoot-intro></p>
    </div>
    <ul class="shoot__list" data-shoot-list></ul>
  </section>

  <!-- ========================== ABOUT ============================ -->
  <section class="about section" id="about">
    <figure class="about__media reveal">
      <img class="about__img" data-about-img alt="" data-parallax-soft />
    </figure>
    <div class="about__body">
      <p class="about__brand reveal" data-about-brand></p>
      <h2 class="about__name reveal" data-about-name></h2>
      <p class="about__role reveal" data-about-role></p>
      <p class="about__text reveal" data-about-body></p>
    </div>
  </section>

  <!-- ========================= BOOKING =========================== -->
  <section class="booking section" id="booking">
    <div class="booking__head">
      <h2 class="booking__heading reveal" data-booking-heading></h2>
      <p class="booking__intro reveal" data-booking-intro></p>
    </div>

    <form class="booking__form reveal" id="bookingForm" novalidate>

      <div class="field">
        <label for="f-name">Name</label>
        <input type="text" id="f-name" name="name" autocomplete="name" required />
        <span class="field__error" data-error-for="name"></span>
      </div>

      <div class="field field--half">
        <label for="f-date">Date</label>
        <input
          type="text"
          id="f-date"
          name="date"
          inputmode="numeric"
          autocomplete="off"
          placeholder="DD/MM/YYYY"
          maxlength="10"
          required
        />
        <span class="field__error" data-error-for="date"></span>
      </div>

      <div class="field field--half">
        <label for="f-time">Time</label>
        <input
          type="text"
          id="f-time"
          name="time"
          inputmode="text"
          autocomplete="off"
          placeholder="e.g. 7:30 PM"
          maxlength="8"
          required
        />
        <span class="field__error" data-error-for="time"></span>
      </div>

      <div class="field field--half">
        <label for="f-phone">Phone number</label>
        <input type="tel" id="f-phone" name="phone" inputmode="tel" autocomplete="tel" required />
        <span class="field__error" data-error-for="phone"></span>
      </div>

      <div class="field field--half">
        <label for="f-city">City</label>
        <select id="f-city" name="city" required>
          <option value="" disabled selected>Select a city</option>
        </select>
        <span class="field__error" data-error-for="city"></span>
      </div>

      <div class="field field--half">
        <label for="f-shoottype">Type of shoot</label>
        <select id="f-shoottype" name="shootType" required>
          <option value="" disabled selected>Select a shoot type</option>
        </select>
        <span class="field__error" data-error-for="shootType"></span>
      </div>

      <div class="field field--address" id="addressField">
        <label for="f-address">Full address</label>
        <input type="text" id="f-address" name="address" autocomplete="street-address" required />
        <span class="field__error" data-error-for="address"></span>
      </div>

      <div class="field">
        <label for="f-message">Message <span class="field__opt">(optional)</span></label>
        <textarea id="f-message" name="message" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn--gold btn--block" data-booking-submit></button>
    </form>
  </section>

  <!-- ========================== FOOTER =========================== -->
  <footer class="footer">
    <div class="footer__top">
      <span class="footer__brand" data-brand-name></span>
      <nav class="footer__links">
        <a data-footer-instagram target="_blank" rel="noopener">Instagram</a>
        <a data-footer-whatsapp target="_blank" rel="noopener">WhatsApp</a>
        <a data-footer-email></a>
      </nav>
    </div>
    <div class="footer__bottom">
      <p class="footer__note" data-footer-note></p>
      <p class="footer__copy" data-footer-copyright></p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
